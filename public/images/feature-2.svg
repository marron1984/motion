<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Connection lines between nodes -->
  <g stroke="#c9a96e" stroke-width="0.6" opacity="0.25">
    <line x1="400" y1="180" x2="260" y2="260"/>
    <line x1="400" y1="180" x2="540" y2="260"/>
    <line x1="260" y1="260" x2="540" y2="260"/>
    <line x1="260" y1="260" x2="180" y2="370"/>
    <line x1="260" y1="260" x2="340" y2="370"/>
    <line x1="540" y1="260" x2="460" y2="370"/>
    <line x1="540" y1="260" x2="620" y2="370"/>
    <line x1="400" y1="180" x2="400" y2="120"/>
    <line x1="180" y1="370" x2="340" y2="370"/>
    <line x1="460" y1="370" x2="620" y2="370"/>
  </g>
  <!-- Interlocking circles -->
  <g stroke="#c9a96e" fill="none" opacity="0.4" stroke-width="0.8">
    <!-- Central large circles interlocking -->
    <circle cx="340" cy="230" r="80"/>
    <circle cx="460" cy="230" r="80"/>
    <circle cx="400" cy="310" r="80"/>
  </g>
  <!-- Secondary interlocking rings -->
  <g stroke="#c9a96e" fill="none" opacity="0.2" stroke-width="0.5">
    <circle cx="340" cy="230" r="100"/>
    <circle cx="460" cy="230" r="100"/>
    <circle cx="400" cy="310" r="100"/>
  </g>
  <!-- Node dots -->
  <g fill="#c9a96e">
    <circle cx="400" cy="180" r="5" opacity="0.6"/>
    <circle cx="260" cy="260" r="4" opacity="0.45"/>
    <circle cx="540" cy="260" r="4" opacity="0.45"/>
    <circle cx="180" cy="370" r="3" opacity="0.3"/>
    <circle cx="340" cy="370" r="3" opacity="0.3"/>
    <circle cx="460" cy="370" r="3" opacity="0.3"/>
    <circle cx="620" cy="370" r="3" opacity="0.3"/>
    <circle cx="400" cy="120" r="3" opacity="0.3"/>
  </g>
  <!-- Central intersection glow -->
  <circle cx="400" cy="250" r="30" fill="url(#nodeGlow)"/>
  <circle cx="400" cy="250" r="4" fill="#c9a96e" opacity="0.5"/>
</svg>
