<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#12002a"/>
      <stop offset="100%" stop-color="#0a001e"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="neon3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="65%" r="30%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow1)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>
  <!-- Large triangle -->
  <polygon points="400,150 180,550 620,550" fill="none" stroke="url(#neon1)" stroke-width="1.5" stroke-opacity="0.4"/>
  <polygon points="400,200 220,520 580,520" fill="none" stroke="url(#neon1)" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Rotated square -->
  <rect x="300" y="400" width="250" height="250" fill="none" stroke="url(#neon2)" stroke-width="1.5" stroke-opacity="0.35" transform="rotate(45, 425, 525)"/>
  <rect x="325" y="425" width="200" height="200" fill="none" stroke="url(#neon2)" stroke-width="1" stroke-opacity="0.15" transform="rotate(45, 425, 525)"/>
  <!-- Circle -->
  <circle cx="350" cy="400" r="150" fill="none" stroke="url(#neon3)" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="350" cy="400" r="120" fill="none" stroke="url(#neon3)" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Hexagon -->
  <polygon points="550,700 620,740 620,820 550,860 480,820 480,740" fill="none" stroke="url(#neon1)" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Grid lines -->
  <line x1="0" y1="500" x2="800" y2="500" stroke="#a855f7" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="1000" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ec4899" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="0" y1="750" x2="800" y2="750" stroke="#ec4899" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="1000" stroke="#a855f7" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="1000" stroke="#a855f7" stroke-opacity="0.04" stroke-width="0.5"/>
  <!-- Dots at intersections -->
  <circle cx="400" cy="500" r="4" fill="#a855f7" fill-opacity="0.5"/>
  <circle cx="200" cy="250" r="3" fill="#ec4899" fill-opacity="0.4"/>
  <circle cx="600" cy="750" r="3" fill="#3b82f6" fill-opacity="0.4"/>
  <circle cx="200" cy="750" r="2" fill="#a855f7" fill-opacity="0.3"/>
  <circle cx="600" cy="250" r="2" fill="#ec4899" fill-opacity="0.3"/>
</svg>