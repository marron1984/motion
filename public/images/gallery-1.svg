<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131210"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="50%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#skyGlow)"/>
  <rect width="800" height="1000" fill="url(#warmLight)"/>
  <!-- Building silhouette - main tower -->
  <g opacity="0.6">
    <rect x="280" y="180" width="240" height="620" fill="#0f0e0c" stroke="#c9a96e" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Windows grid -->
    <g fill="url(#windowGlow)" opacity="0.4">
      <rect x="300" y="220" width="18" height="25" rx="1"/><rect x="330" y="220" width="18" height="25" rx="1"/>
      <rect x="360" y="220" width="18" height="25" rx="1"/><rect x="390" y="220" width="18" height="25" rx="1"/>
      <rect x="420" y="220" width="18" height="25" rx="1"/><rect x="450" y="220" width="18" height="25" rx="1"/>
      <rect x="480" y="220" width="18" height="25" rx="1"/>
      <rect x="300" y="270" width="18" height="25" rx="1"/><rect x="330" y="270" width="18" height="25" rx="1"/>
      <rect x="360" y="270" width="18" height="25" rx="1"/><rect x="390" y="270" width="18" height="25" rx="1"/>
      <rect x="420" y="270" width="18" height="25" rx="1"/><rect x="450" y="270" width="18" height="25" rx="1"/>
      <rect x="480" y="270" width="18" height="25" rx="1"/>
      <rect x="300" y="320" width="18" height="25" rx="1"/><rect x="330" y="320" width="18" height="25" rx="1"/>
      <rect x="360" y="320" width="18" height="25" rx="1"/><rect x="390" y="320" width="18" height="25" rx="1"/>
      <rect x="420" y="320" width="18" height="25" rx="1"/><rect x="450" y="320" width="18" height="25" rx="1"/>
      <rect x="480" y="320" width="18" height="25" rx="1"/>
      <rect x="300" y="370" width="18" height="25" rx="1"/><rect x="330" y="370" width="18" height="25" rx="1"/>
      <rect x="360" y="370" width="18" height="25" rx="1"/><rect x="390" y="370" width="18" height="25" rx="1"/>
      <rect x="420" y="370" width="18" height="25" rx="1"/><rect x="450" y="370" width="18" height="25" rx="1"/>
      <rect x="480" y="370" width="18" height="25" rx="1"/>
      <rect x="300" y="420" width="18" height="25" rx="1"/><rect x="330" y="420" width="18" height="25" rx="1"/>
      <rect x="360" y="420" width="18" height="25" rx="1"/><rect x="390" y="420" width="18" height="25" rx="1"/>
      <rect x="420" y="420" width="18" height="25" rx="1"/><rect x="450" y="420" width="18" height="25" rx="1"/>
      <rect x="480" y="420" width="18" height="25" rx="1"/>
      <rect x="300" y="470" width="18" height="25" rx="1"/><rect x="330" y="470" width="18" height="25" rx="1"/>
      <rect x="360" y="470" width="18" height="25" rx="1"/><rect x="390" y="470" width="18" height="25" rx="1"/>
      <rect x="420" y="470" width="18" height="25" rx="1"/><rect x="450" y="470" width="18" height="25" rx="1"/>
      <rect x="480" y="470" width="18" height="25" rx="1"/>
      <rect x="300" y="520" width="18" height="25" rx="1"/><rect x="330" y="520" width="18" height="25" rx="1"/>
      <rect x="360" y="520" width="18" height="25" rx="1"/><rect x="390" y="520" width="18" height="25" rx="1"/>
      <rect x="420" y="520" width="18" height="25" rx="1"/><rect x="450" y="520" width="18" height="25" rx="1"/>
      <rect x="480" y="520" width="18" height="25" rx="1"/>
    </g>
  </g>
  <!-- Left wing -->
  <rect x="120" y="400" width="160" height="400" fill="#0d0c0a" stroke="#c9a96e" stroke-width="0.4" stroke-opacity="0.2" opacity="0.6"/>
  <!-- Right wing -->
  <rect x="520" y="350" width="160" height="450" fill="#0d0c0a" stroke="#c9a96e" stroke-width="0.4" stroke-opacity="0.2" opacity="0.6"/>
  <!-- Entrance canopy -->
  <rect x="350" y="760" width="100" height="40" fill="#c9a96e" opacity="0.12" rx="2"/>
  <!-- Entrance glow -->
  <radialGradient id="entrGlow" cx="50%" cy="100%" r="30%" xmlns="http://www.w3.org/2000/svg">
    <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
  </radialGradient>
  <rect x="350" y="700" width="100" height="100" fill="url(#entrGlow)"/>
  <!-- Ground/landscape -->
  <line x1="50" y1="800" x2="750" y2="800" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <!-- Stars -->
  <g fill="#c9a96e" opacity="0.2">
    <circle cx="150" cy="80" r="1"/><circle cx="300" cy="50" r="1.2"/>
    <circle cx="500" cy="70" r="0.8"/><circle cx="650" cy="90" r="1"/>
    <circle cx="100" cy="130" r="0.8"/><circle cx="700" cy="40" r="1"/>
  </g>
</svg>
