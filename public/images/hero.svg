<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="50%" stop-color="#131210"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c9a96e" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#c9a96e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldFadeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c9a96e" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c9a96e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <!-- Elegant diamond grid pattern -->
  <g opacity="0.15" stroke="#c9a96e" stroke-width="0.5" fill="none">
    <line x1="200" y1="0" x2="600" y2="675"/>
    <line x1="400" y1="0" x2="800" y2="675"/>
    <line x1="600" y1="0" x2="1000" y2="675"/>
    <line x1="800" y1="0" x2="1200" y2="675"/>
    <line x1="0" y1="0" x2="400" y2="675"/>
    <line x1="1000" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="0" y2="675"/>
    <line x1="1200" y1="0" x2="800" y2="675"/>
  </g>
  <!-- Horizontal accent lines -->
  <line x1="0" y1="337" x2="1200" y2="337" stroke="url(#goldFade)" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="url(#goldFade)" stroke-width="0.3" opacity="0.25"/>
  <line x1="0" y1="455" x2="1200" y2="455" stroke="url(#goldFade)" stroke-width="0.3" opacity="0.25"/>
  <!-- Central geometric diamond -->
  <g transform="translate(600,337)" opacity="0.3" stroke="#c9a96e" fill="none" stroke-width="0.8">
    <polygon points="0,-120 160,0 0,120 -160,0"/>
    <polygon points="0,-80 107,0 0,80 -107,0"/>
    <polygon points="0,-40 53,0 0,40 -53,0"/>
  </g>
  <!-- Corner accents -->
  <g opacity="0.2" stroke="#c9a96e" stroke-width="0.6" fill="none">
    <path d="M0,0 L80,0 L80,80"/>
    <path d="M1200,0 L1120,0 L1120,80"/>
    <path d="M0,675 L80,675 L80,595"/>
    <path d="M1200,675 L1120,675 L1120,595"/>
  </g>
  <!-- Subtle gold dots at intersections -->
  <g fill="#c9a96e" opacity="0.3">
    <circle cx="600" cy="337" r="3"/>
    <circle cx="600" cy="217" r="1.5"/>
    <circle cx="600" cy="457" r="1.5"/>
    <circle cx="440" cy="337" r="1.5"/>
    <circle cx="760" cy="337" r="1.5"/>
  </g>
  <!-- Decorative thin horizontal rules -->
  <g opacity="0.12" stroke="#c9a96e" stroke-width="0.3">
    <line x1="100" y1="100" x2="1100" y2="100"/>
    <line x1="100" y1="575" x2="1100" y2="575"/>
  </g>
</svg>
