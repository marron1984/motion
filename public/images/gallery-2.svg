<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="75%" cy="20%" r="20%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#moonGlow)"/>
  <!-- Zen garden raked sand lines -->
  <g stroke="#c9a96e" stroke-width="0.4" fill="none" opacity="0.15">
    <path d="M50,380 Q200,370 350,380 Q500,390 650,380 Q730,375 780,378"/>
    <path d="M50,395 Q200,385 350,395 Q500,405 650,395 Q730,390 780,393"/>
    <path d="M50,410 Q200,400 350,410 Q500,420 650,410 Q730,405 780,408"/>
    <path d="M50,425 Q200,415 350,425 Q500,435 650,425 Q730,420 780,423"/>
    <path d="M50,440 Q200,430 350,440 Q500,450 650,440 Q730,435 780,438"/>
    <path d="M50,455 Q200,445 350,455 Q500,465 650,455 Q730,450 780,453"/>
    <path d="M50,470 Q200,460 350,470 Q500,480 650,470 Q730,465 780,468"/>
    <path d="M50,485 Q200,475 350,485 Q500,495 650,485 Q730,480 780,483"/>
    <path d="M50,500 Q200,490 350,500 Q500,510 650,500 Q730,495 780,498"/>
    <path d="M50,515 Q200,505 350,515 Q500,525 650,515 Q730,510 780,513"/>
  </g>
  <!-- Circular raked patterns around stones -->
  <g stroke="#c9a96e" stroke-width="0.4" fill="none" opacity="0.18">
    <ellipse cx="300" cy="430" rx="60" ry="20"/>
    <ellipse cx="300" cy="430" rx="75" ry="28"/>
    <ellipse cx="300" cy="430" rx="90" ry="36"/>
    <ellipse cx="560" cy="460" rx="45" ry="15"/>
    <ellipse cx="560" cy="460" rx="58" ry="22"/>
    <ellipse cx="560" cy="460" rx="72" ry="29"/>
  </g>
  <!-- Zen stones -->
  <g fill="#1a1815" stroke="#c9a96e" stroke-width="0.6" stroke-opacity="0.35">
    <ellipse cx="300" cy="420" rx="30" ry="22"/>
    <ellipse cx="285" cy="405" rx="18" ry="14"/>
    <ellipse cx="310" cy="408" rx="12" ry="10"/>
  </g>
  <g fill="#1a1815" stroke="#c9a96e" stroke-width="0.6" stroke-opacity="0.35">
    <ellipse cx="560" cy="452" rx="22" ry="16"/>
    <ellipse cx="550" cy="442" rx="14" ry="10"/>
  </g>
  <!-- Bamboo/tree shapes on left -->
  <g stroke="#c9a96e" stroke-width="1" opacity="0.25" fill="none">
    <line x1="80" y1="380" x2="80" y2="150"/>
    <line x1="100" y1="380" x2="100" y2="180"/>
    <line x1="120" y1="380" x2="120" y2="200"/>
  </g>
  <!-- Foliage suggestion -->
  <g fill="#c9a96e" opacity="0.08">
    <circle cx="80" cy="150" r="30"/>
    <circle cx="100" cy="170" r="25"/>
    <circle cx="120" cy="190" r="22"/>
    <circle cx="95" cy="140" r="28"/>
  </g>
  <!-- Moon -->
  <circle cx="620" cy="100" r="30" fill="#c9a96e" opacity="0.06"/>
  <circle cx="620" cy="100" r="20" fill="#c9a96e" opacity="0.08"/>
  <circle cx="620" cy="100" r="2" fill="#c9a96e" opacity="0.4"/>
  <!-- Stone lantern abstract -->
  <g stroke="#c9a96e" stroke-width="0.8" fill="none" opacity="0.3" transform="translate(680,300)">
    <rect x="-8" y="0" width="16" height="60"/>
    <rect x="-15" y="-8" width="30" height="10" rx="2"/>
    <polygon points="0,-22 -18,-8 18,-8"/>
    <rect x="-4" y="60" width="8" height="15"/>
    <rect x="-12" y="75" width="24" height="5"/>
  </g>
