<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#glow)"/>
  <!-- Medical wellness - abstract healing hands/circles -->
  <g transform="translate(400,266)" stroke="#c9a96e" fill="none" opacity="0.35" stroke-width="0.8">
    <!-- Concentric healing circles -->
    <circle r="40"/>
    <circle r="65"/>
    <circle r="90"/>
    <circle r="115" stroke-dasharray="4,8" opacity="0.6"/>
    <circle r="140" stroke-dasharray="2,10" opacity="0.4"/>
  </g>
  <!-- Central cross/plus (medical) -->
  <g transform="translate(400,266)" stroke="#c9a96e" fill="none" opacity="0.4" stroke-width="1">
    <line x1="0" y1="-25" x2="0" y2="25"/>
    <line x1="-25" y1="0" x2="25" y2="0"/>
  </g>
  <circle cx="400" cy="266" r="5" fill="#c9a96e" opacity="0.2"/>
  <!-- Abstract wave patterns (wellness) -->
  <g stroke="#c9a96e" fill="none" opacity="0.15" stroke-width="0.5">
    <path d="M100,400 Q200,380 300,400 Q400,420 500,400 Q600,380 700,400"/>
    <path d="M100,415 Q200,395 300,415 Q400,435 500,415 Q600,395 700,415"/>
    <path d="M100,430 Q200,410 300,430 Q400,450 500,430 Q600,410 700,430"/>
  </g>
  <!-- Leaf/nature wellness elements -->
  <g stroke="#c9a96e" fill="none" opacity="0.2" stroke-width="0.6">
    <path d="M200,200 Q230,170 260,200 Q230,230 200,200"/>
    <line x1="230" y1="200" x2="230" y2="240"/>
    <path d="M560,180 Q590,150 620,180 Q590,210 560,180"/>
    <line x1="590" y1="180" x2="590" y2="220"/>
  </g>
</svg>
