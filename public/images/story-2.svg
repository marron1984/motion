<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a14"/>
      <stop offset="50%" stop-color="#3b1028"/>
      <stop offset="100%" stop-color="#5c1a3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- Cursor arrow -->
  <path d="M260 130 L260 280 L295 250 L330 310 L350 300 L315 240 L355 235 Z" fill="none" stroke="#f472b6" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>
  <path d="M268 148 L268 265 L298 240 L328 295 L340 290 L310 235 L343 230 Z" fill="#f472b6" fill-opacity="0.06"/>
  <!-- Click ripple rings -->
  <circle cx="265" cy="135" r="20" fill="none" stroke="#f472b6" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="265" cy="135" r="35" fill="none" stroke="#f472b6" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="265" cy="135" r="50" fill="none" stroke="#f472b6" stroke-opacity="0.06" stroke-width="1"/>
  <!-- Click dot -->
  <circle cx="265" cy="135" r="5" fill="#f472b6" fill-opacity="0.3"/>
  <!-- Touch/tap indicators -->
  <circle cx="450" cy="180" r="15" fill="none" stroke="#fb7185" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="450" cy="180" r="6" fill="#fb7185" fill-opacity="0.12"/>
  <circle cx="160" cy="280" r="12" fill="none" stroke="#ec4899" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="160" cy="280" r="4" fill="#ec4899" fill-opacity="0.1"/>
  <!-- Gesture swipe line -->
  <path d="M420 260 Q460 240 500 260 Q540 280 560 260" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arrow head on swipe -->
  <path d="M555 255 L565 260 L555 265" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="2" fill="#f472b6" fill-opacity="0.15"/>
  <circle cx="520" cy="100" r="1.5" fill="#fb7185" fill-opacity="0.12"/>
  <circle cx="480" cy="340" r="2" fill="#f472b6" fill-opacity="0.1"/>
  <circle cx="130" cy="180" r="1.5" fill="#ec4899" fill-opacity="0.12"/>
</svg>