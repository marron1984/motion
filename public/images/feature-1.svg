<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0520"/>
      <stop offset="50%" stop-color="#1a0a35"/>
      <stop offset="100%" stop-color="#2d1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Motion curves -->
  <path d="M50 350 Q200 250 350 280 Q500 310 650 200 Q720 160 780 180" fill="none" stroke="url(#line1)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 300 Q180 200 330 240 Q480 280 630 170 Q710 120 790 150" fill="none" stroke="url(#line2)" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 400 Q220 320 370 340 Q520 360 670 260 Q740 220 800 240" fill="none" stroke="url(#line1)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Speed dots along curve -->
  <circle cx="200" cy="260" r="4" fill="#a855f7" fill-opacity="0.6"/>
  <circle cx="250" cy="255" r="3" fill="#a855f7" fill-opacity="0.4"/>
  <circle cx="300" cy="260" r="2.5" fill="#a855f7" fill-opacity="0.3"/>
  <circle cx="500" cy="290" r="4" fill="#c084fc" fill-opacity="0.5"/>
  <circle cx="550" cy="270" r="3" fill="#c084fc" fill-opacity="0.35"/>
  <circle cx="650" cy="205" r="4" fill="#8b5cf6" fill-opacity="0.5"/>
  <!-- Motion blur lines -->
  <line x1="150" y1="180" x2="280" y2="180" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="1" stroke-linecap="round"/>
  <line x1="180" y1="195" x2="260" y2="195" stroke="#a855f7" stroke-opacity="0.1" stroke-width="1" stroke-linecap="round"/>
  <line x1="500" y1="130" x2="630" y2="130" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1" stroke-linecap="round"/>
  <line x1="520" y1="145" x2="600" y2="145" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1" stroke-linecap="round"/>
  <!-- Trailing particles -->
  <circle cx="120" cy="330" r="2" fill="#c084fc" fill-opacity="0.25"/>
  <circle cx="400" cy="150" r="1.5" fill="#a855f7" fill-opacity="0.2"/>
  <circle cx="700" cy="300" r="2" fill="#7c3aed" fill-opacity="0.2"/>
</svg>