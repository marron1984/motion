<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Ground line -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
  <!-- Abstract architectural building shapes -->
  <g stroke="#c9a96e" fill="none" opacity="0.5" stroke-width="0.8">
    <!-- Main tower -->
    <rect x="340" y="120" width="120" height="280" rx="1"/>
    <line x1="340" y1="160" x2="460" y2="160"/>
    <line x1="340" y1="200" x2="460" y2="200"/>
    <line x1="340" y1="240" x2="460" y2="240"/>
    <line x1="340" y1="280" x2="460" y2="280"/>
    <line x1="340" y1="320" x2="460" y2="320"/>
    <line x1="340" y1="360" x2="460" y2="360"/>
    <line x1="400" y1="120" x2="400" y2="400"/>
    <!-- Left wing -->
    <rect x="200" y="200" width="140" height="200" rx="1"/>
    <line x1="200" y1="250" x2="340" y2="250"/>
    <line x1="200" y1="300" x2="340" y2="300"/>
    <line x1="200" y1="350" x2="340" y2="350"/>
    <line x1="270" y1="200" x2="270" y2="400"/>
    <!-- Right wing -->
    <rect x="460" y="240" width="140" height="160" rx="1"/>
    <line x1="460" y1="280" x2="600" y2="280"/>
    <line x1="460" y1="320" x2="600" y2="320"/>
    <line x1="460" y1="360" x2="600" y2="360"/>
    <line x1="530" y1="240" x2="530" y2="400"/>
  </g>
  <!-- Architectural accent - spire -->
  <line x1="400" y1="120" x2="400" y2="80" stroke="#c9a96e" stroke-width="1" opacity="0.6"/>
  <circle cx="400" cy="75" r="3" fill="#c9a96e" opacity="0.4"/>
  <!-- Subtle grid perspective lines -->
  <g stroke="#c9a96e" stroke-width="0.3" opacity="0.1">
    <line x1="400" y1="80" x2="100" y2="400"/>
    <line x1="400" y1="80" x2="700" y2="400"/>
    <line x1="400" y1="80" x2="50" y2="300"/>
    <line x1="400" y1="80" x2="750" y2="300"/>
  </g>
  <!-- Warm light dots (windows) -->
  <g fill="#c9a96e" opacity="0.35">
    <rect x="355" y="135" width="8" height="12" rx="1"/>
    <rect x="375" y="135" width="8" height="12" rx="1"/>
    <rect x="417" y="135" width="8" height="12" rx="1"/>
    <rect x="437" y="135" width="8" height="12" rx="1"/>
    <rect x="355" y="170" width="8" height="12" rx="1"/>
    <rect x="375" y="170" width="8" height="12" rx="1"/>
    <rect x="417" y="170" width="8" height="12" rx="1"/>
    <rect x="437" y="170" width="8" height="12" rx="1"/>
    <rect x="355" y="210" width="8" height="12" rx="1"/>
    <rect x="375" y="210" width="8" height="12" rx="1"/>
    <rect x="417" y="210" width="8" height="12" rx="1"/>
    <rect x="437" y="210" width="8" height="12" rx="1"/>
  </g>
</svg>
