<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131210"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a96e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#glow)"/>
  <!-- Heart/care symbol abstract -->
  <g transform="translate(400,220)" stroke="#c9a96e" fill="none" opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M0,20 Q0,0 -20,-15 Q-45,-35 -45,-55 Q-45,-80 -25,-85 Q0,-90 0,-65"/>
    <path d="M0,20 Q0,0 20,-15 Q45,-35 45,-55 Q45,-80 25,-85 Q0,-90 0,-65"/>
  </g>
  <!-- Outer heart echo -->
  <g transform="translate(400,220) scale(1.4)" stroke="#c9a96e" fill="none" opacity="0.12" stroke-width="0.5" stroke-linecap="round">
    <path d="M0,20 Q0,0 -20,-15 Q-45,-35 -45,-55 Q-45,-80 -25,-85 Q0,-90 0,-65"/>
    <path d="M0,20 Q0,0 20,-15 Q45,-35 45,-55 Q45,-80 25,-85 Q0,-90 0,-65"/>
  </g>
  <!-- Hands cradling (abstract) -->
  <g stroke="#c9a96e" fill="none" opacity="0.2" stroke-width="0.8" stroke-linecap="round">
    <path d="M280,300 Q300,340 340,360 Q380,375 400,380"/>
    <path d="M520,300 Q500,340 460,360 Q420,375 400,380"/>
    <!-- Fingers -->
    <path d="M275,295 Q260,280 265,265"/>
    <path d="M525,295 Q540,280 535,265"/>
  </g>
  <!-- Radiating care lines -->
  <g stroke="#c9a96e" stroke-width="0.4" opacity="0.12">
    <line x1="400" y1="130" x2="400" y2="100"/>
    <line x1="340" y1="145" x2="320" y2="120"/>
    <line x1="460" y1="145" x2="480" y2="120"/>
    <line x1="310" y1="180" x2="280" y2="165"/>
    <line x1="490" y1="180" x2="520" y2="165"/>
  </g>
  <!-- Connection dots pattern below -->
  <g fill="#c9a96e" opacity="0.15">
    <circle cx="300" cy="430" r="2"/>
    <circle cx="350" cy="440" r="2"/>
    <circle cx="400" cy="445" r="2.5"/>
    <circle cx="450" cy="440" r="2"/>
    <circle cx="500" cy="430" r="2"/>
  </g>
  <g stroke="#c9a96e" stroke-width="0.3" opacity="0.1">
    <line x1="300" y1="430" x2="350" y2="440"/>
    <line x1="350" y1="440" x2="400" y2="445"/>
    <line x1="400" y1="445" x2="450" y2="440"/>
    <line x1="450" y1="440" x2="500" y2="430"/>
  </g>
  <!-- Subtle wave at bottom -->
  <path d="M0,500 Q200,480 400,500 Q600,520 800,500" stroke="#c9a96e" stroke-width="0.4" fill="none" opacity="0.1"/>
</svg>
