<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="70%" stop-color="#131210"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deerGlow" cx="40%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#sunGlow)"/>
  <rect width="800" height="600" fill="url(#deerGlow)"/>
  <!-- Ground -->
  <line x1="50" y1="480" x2="750" y2="480" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>
  <!-- Deer silhouette - elegant minimalist -->
  <g transform="translate(320,250)" stroke="#c9a96e" fill="none" opacity="0.5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="0" cy="100" rx="70" ry="40"/>
    <!-- Neck -->
    <path d="M-30,70 Q-40,30 -25,-10"/>
    <path d="M-15,65 Q-20,30 -10,-5"/>
    <!-- Head -->
    <ellipse cx="-20" cy="-20" rx="22" ry="15" transform="rotate(-15,-20,-20)"/>
    <!-- Ears -->
    <path d="M-35,-30 Q-45,-55 -30,-45"/>
    <path d="M-10,-32 Q-5,-58 5,-42"/>
    <!-- Antlers -->
    <g stroke-width="0.9" opacity="0.7">
      <path d="M-25,-40 L-35,-80 L-50,-90"/>
      <path d="M-35,-80 L-25,-100"/>
      <path d="M-35,-80 L-45,-105"/>
      <path d="M-8,-38 L5,-78 L20,-88"/>
      <path d="M5,-78 L10,-100"/>
      <path d="M5,-78 L18,-102"/>
    </g>
    <!-- Front legs -->
    <line x1="-35" y1="135" x2="-40" y2="230"/>
    <line x1="-15" y1="135" x2="-18" y2="230"/>
    <!-- Back legs -->
    <line x1="30" y1="130" x2="25" y2="230"/>
    <line x1="50" y1="125" x2="48" y2="230"/>
    <!-- Tail -->
    <path d="M65,85 Q80,75 75,65"/>
    <!-- Eye -->
    <circle cx="-28" cy="-18" r="2" fill="#c9a96e" stroke="none" opacity="0.5"/>
  </g>
  <!-- Small golden light particles around deer -->
  <g fill="#c9a96e" opacity="0.25">
    <circle cx="220" cy="300" r="1.5"/>
    <circle cx="450" cy="280" r="1"/>
    <circle cx="380" cy="200" r="1.2"/>
    <circle cx="260" cy="350" r="1"/>
    <circle cx="420" cy="380" r="1.5"/>
    <circle cx="340" cy="160" r="0.8"/>
    <circle cx="500" cy="320" r="1"/>
    <circle cx="200" cy="250" r="0.8"/>
  </g>
  <!-- Background trees suggestion -->
  <g fill="#c9a96e" opacity="0.04">
    <circle cx="600" cy="250" r="80"/>
    <circle cx="650" cy="300" r="70"/>
    <circle cx="700" cy="280" r="60"/>
    <circle cx="100" cy="300" r="70"/>
    <circle cx="130" cy="350" r="60"/>
  </g>
  <!-- Tree trunks -->
  <g stroke="#c9a96e" stroke-width="1" opacity="0.12">
    <line x1="600" y1="330" x2="600" y2="480"/>
    <line x1="660" y1="360" x2="660" y2="480"/>
    <line x1="100" y1="370" x2="100" y2="480"/>
  </g>
  <!-- Falling leaves / cherry blossom petals -->
  <g fill="#c9a96e" opacity="0.15">
    <ellipse cx="480" cy="180" rx="4" ry="2" transform="rotate(30,480,180)"/>
    <ellipse cx="520" cy="250" rx="3" ry="1.5" transform="rotate(-20,520,250)"/>
    <ellipse cx="560" cy="150" rx="3.5" ry="1.5" transform="rotate(45,560,150)"/>
    <ellipse cx="440" cy="130" rx="3" ry="1.5" transform="rotate(10,440,130)"/>
  </g>
</svg>
