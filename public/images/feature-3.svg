<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Grid lines -->
  <g stroke="#c9a96e" stroke-width="0.3" opacity="0.12">
    <line x1="150" y1="400" x2="700" y2="400"/>
    <line x1="150" y1="340" x2="700" y2="340"/>
    <line x1="150" y1="280" x2="700" y2="280"/>
    <line x1="150" y1="220" x2="700" y2="220"/>
    <line x1="150" y1="160" x2="700" y2="160"/>
    <line x1="150" y1="100" x2="700" y2="100"/>
  </g>
  <!-- Axis lines -->
  <line x1="150" y1="400" x2="700" y2="400" stroke="#c9a96e" stroke-width="0.6" opacity="0.3"/>
  <line x1="150" y1="100" x2="150" y2="400" stroke="#c9a96e" stroke-width="0.6" opacity="0.3"/>
  <!-- Upward trending line - main -->
  <polyline points="180,370 250,350 320,330 390,280 440,240 500,200 560,150 630,120 680,100"
    stroke="#c9a96e" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area fill under the line -->
  <polygon points="180,370 250,350 320,330 390,280 440,240 500,200 560,150 630,120 680,100 680,400 180,400"
    fill="url(#goldUp)" opacity="0.4"/>
  <!-- Secondary trend line -->
  <polyline points="180,380 250,370 320,360 390,340 440,310 500,280 560,260 630,230 680,210"
    stroke="#c9a96e" stroke-width="1" fill="none" opacity="0.25" stroke-dasharray="4,4"/>
  <!-- Data points on main line -->
  <g fill="#c9a96e">
    <circle cx="180" cy="370" r="3" opacity="0.5"/>
    <circle cx="250" cy="350" r="3" opacity="0.5"/>
    <circle cx="320" cy="330" r="3" opacity="0.5"/>
    <circle cx="390" cy="280" r="3.5" opacity="0.55"/>
    <circle cx="440" cy="240" r="3.5" opacity="0.55"/>
    <circle cx="500" cy="200" r="4" opacity="0.6"/>
    <circle cx="560" cy="150" r="4" opacity="0.6"/>
    <circle cx="630" cy="120" r="4.5" opacity="0.65"/>
    <circle cx="680" cy="100" r="5" opacity="0.7"/>
  </g>
  <!-- Bar chart elements in background -->
  <g fill="#c9a96e" opacity="0.08">
    <rect x="195" y="350" width="30" height="50" rx="1"/>
    <rect x="275" y="330" width="30" height="70" rx="1"/>
    <rect x="355" y="290" width="30" height="110" rx="1"/>
    <rect x="435" y="250" width="30" height="150" rx="1"/>
    <rect x="515" y="210" width="30" height="190" rx="1"/>
    <rect x="595" y="160" width="30" height="240" rx="1"/>
    <rect x="655" y="120" width="30" height="280" rx="1"/>
  </g>
</svg>
