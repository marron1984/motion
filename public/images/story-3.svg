<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  <rect width="800" height="533" fill="url(#glow)"/>
  <!-- Abstract journey/path - winding road -->
  <g stroke="#c9a96e" fill="none" stroke-width="1" opacity="0.35" stroke-linecap="round">
    <path d="M100,450 Q200,430 250,380 Q300,330 350,320 Q400,310 450,280 Q500,250 530,200 Q560,150 620,130 Q680,110 720,100"/>
  </g>
  <!-- Path border lines -->
  <g stroke="#c9a96e" fill="none" stroke-width="0.4" opacity="0.15" stroke-linecap="round">
    <path d="M95,445 Q195,425 245,375 Q295,325 345,315 Q395,305 445,275 Q495,245 525,195 Q555,145 615,125 Q675,105 715,95"/>
    <path d="M105,455 Q205,435 255,385 Q305,335 355,325 Q405,315 455,285 Q505,255 535,205 Q565,155 625,135 Q685,115 725,105"/>
  </g>
  <!-- Milestone dots along path -->
  <g fill="#c9a96e">
    <circle cx="100" cy="450" r="4" opacity="0.3"/>
    <circle cx="250" cy="380" r="4" opacity="0.35"/>
    <circle cx="400" cy="310" r="5" opacity="0.4"/>
    <circle cx="530" cy="200" r="5" opacity="0.45"/>
    <circle cx="720" cy="100" r="6" opacity="0.5"/>
  </g>
  <!-- Connecting vertical lines from milestones -->
  <g stroke="#c9a96e" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,4">
    <line x1="100" y1="450" x2="100" y2="500"/>
    <line x1="250" y1="380" x2="250" y2="500"/>
    <line x1="400" y1="310" x2="400" y2="500"/>
    <line x1="530" y1="200" x2="530" y2="500"/>
    <line x1="720" y1="100" x2="720" y2="500"/>
  </g>
  <!-- Arrow at end -->
  <g stroke="#c9a96e" fill="none" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <polyline points="705,110 720,100 710,85"/>
  </g>
  <!-- Abstract building icons at milestones -->
  <g stroke="#c9a96e" fill="none" opacity="0.15" stroke-width="0.5">
    <!-- Small building at milestone 2 -->
    <rect x="240" y="350" width="20" height="25"/>
    <line x1="245" y1="358" x2="255" y2="358"/>
    <line x1="245" y1="366" x2="255" y2="366"/>
    <!-- Larger building at milestone 4 -->
    <rect x="518" y="160" width="24" height="35"/>
    <line x1="523" y1="170" x2="537" y2="170"/>
    <line x1="523" y1="180" x2="537" y2="180"/>
    <line x1="523" y1="190" x2="537" y2="190"/>
  </g>
</svg>
