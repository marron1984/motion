<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a18"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0a4a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speedline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="speedline2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- Speed lines - main burst -->
  <line x1="100" y1="180" x2="480" y2="180" stroke="url(#speedline)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="200" x2="500" y2="200" stroke="url(#speedline2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="220" x2="460" y2="220" stroke="url(#speedline)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="180" y1="160" x2="470" y2="160" stroke="url(#speedline2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="240" x2="440" y2="240" stroke="url(#speedline)" stroke-width="1" stroke-linecap="round"/>
  <line x1="200" y1="145" x2="450" y2="145" stroke="url(#speedline2)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="160" y1="258" x2="420" y2="258" stroke="url(#speedline)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Speed arrow head -->
  <path d="M490 170 L520 200 L490 230" fill="none" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M505 180 L525 200 L505 220" fill="none" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Speedometer arc -->
  <path d="M200 320 A100 100 0 0 1 400 320" fill="none" stroke="#14b8a6" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Speedometer tick marks -->
  <line x1="210" y1="310" x2="220" y2="300" stroke="#14b8a6" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="250" y1="280" x2="260" y2="270" stroke="#14b8a6" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="300" y1="265" x2="300" y2="252" stroke="#14b8a6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="350" y1="280" x2="340" y2="270" stroke="#14b8a6" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="390" y1="310" x2="380" y2="300" stroke="#14b8a6" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Needle pointing fast -->
  <line x1="300" y1="320" x2="370" y2="280" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  <circle cx="300" cy="320" r="5" fill="#14b8a6" fill-opacity="0.2"/>
  <!-- Motion particles -->
  <circle cx="130" cy="190" r="2" fill="#2dd4bf" fill-opacity="0.25"/>
  <circle cx="200" cy="170" r="1.5" fill="#14b8a6" fill-opacity="0.2"/>
  <circle cx="250" cy="210" r="2" fill="#2dd4bf" fill-opacity="0.15"/>
  <circle cx="80" cy="150" r="1.5" fill="#14b8a6" fill-opacity="0.12"/>
  <circle cx="100" cy="270" r="1" fill="#2dd4bf" fill-opacity="0.12"/>
</svg>