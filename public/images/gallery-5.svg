<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#131210"/>
    </linearGradient>
    <radialGradient id="cleanGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#cleanGlow)"/>
  <!-- Clean geometric cross/medical symbol -->
  <g transform="translate(400,350)" stroke="#c9a96e" fill="none" opacity="0.35" stroke-width="1.2">
    <rect x="-30" y="-90" width="60" height="180" rx="4"/>
    <rect x="-90" y="-30" width="180" height="60" rx="4"/>
  </g>
  <g transform="translate(400,350)" stroke="#c9a96e" fill="none" opacity="0.15" stroke-width="0.6">
    <rect x="-45" y="-105" width="90" height="210" rx="6"/>
    <rect x="-105" y="-45" width="210" height="90" rx="6"/>
  </g>
  <!-- Circular elements (medical/wellness) -->
  <circle cx="400" cy="350" r="120" stroke="#c9a96e" stroke-width="0.5" fill="none" opacity="0.2"/>
  <circle cx="400" cy="350" r="150" stroke="#c9a96e" stroke-width="0.3" fill="none" opacity="0.12"/>
  <circle cx="400" cy="350" r="180" stroke="#c9a96e" stroke-width="0.3" fill="none" opacity="0.08" stroke-dasharray="3,6"/>
  <!-- Heartbeat/pulse line -->
  <polyline points="100,600 200,600 250,600 270,600 290,560 310,640 330,580 350,620 370,600 500,600 700,600"
    stroke="#c9a96e" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- DNA/helix suggestion -->
  <g transform="translate(400,700)" stroke="#c9a96e" fill="none" opacity="0.15" stroke-width="0.6">
    <path d="M-80,0 Q-40,-30 0,0 Q40,30 80,0"/>
    <path d="M-80,0 Q-40,30 0,0 Q40,-30 80,0"/>
    <path d="M-80,30 Q-40,0 0,30 Q40,60 80,30"/>
    <path d="M-80,30 Q-40,60 0,30 Q40,0 80,30"/>
    <path d="M-80,60 Q-40,30 0,60 Q40,90 80,60"/>
    <path d="M-80,60 Q-40,90 0,60 Q40,30 80,60"/>
  </g>
  <!-- Connection lines between helices -->
  <g stroke="#c9a96e" stroke-width="0.3" opacity="0.1">
    <line x1="335" y1="700" x2="465" y2="700"/>
    <line x1="345" y1="715" x2="455" y2="715"/>
    <line x1="340" y1="730" x2="460" y2="730"/>
    <line x1="350" y1="745" x2="450" y2="745"/>
    <line x1="355" y1="760" x2="445" y2="760"/>
  </g>
  <!-- Abstract molecules/dots -->
  <g fill="#c9a96e" opacity="0.2">
    <circle cx="250" cy="250" r="4"/>
    <circle cx="550" cy="250" r="4"/>
    <circle cx="250" cy="450" r="4"/>
    <circle cx="550" cy="450" r="4"/>
  </g>
  <g stroke="#c9a96e" stroke-width="0.4" opacity="0.1">
    <line x1="250" y1="250" x2="400" y2="350"/>
    <line x1="550" y1="250" x2="400" y2="350"/>
    <line x1="250" y1="450" x2="400" y2="350"/>
    <line x1="550" y1="450" x2="400" y2="350"/>
  </g>
  <!-- Clean horizontal dividers -->
  <line x1="200" y1="180" x2="600" y2="180" stroke="#c9a96e" stroke-width="0.3" opacity="0.12"/>
  <line x1="200" y1="520" x2="600" y2="520" stroke="#c9a96e" stroke-width="0.3" opacity="0.12"/>
</svg>
